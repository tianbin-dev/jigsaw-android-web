<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <title>数字推盘 NumPush · 网页版</title>
  <meta name="description" content="源自 jigsaw-android 的数字推盘小游戏网页版：3×3 / 4×4 / 5×5 三种难度，支持鼠标与触摸操作。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="assets/number_level_3.png">
</head>
<body>
  <main class="app">
    <section id="startView" class="view start-view" aria-label="游戏开始页">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">N</span>
        <div class="brand-text">
          <h1>NumPush</h1>
          <p>数字推盘</p>
        </div>
      </header>

      <div class="level-bar">
        <p class="level-title">游戏难度：<strong id="levelLabel">低级</strong></p>
        <button id="changeLevelBtn" class="outline-btn" type="button">修改</button>
      </div>

      <p class="intro">数字推盘：点击下方开始按钮后，点击空白区域周围的数字，直到数字顺序与下图一致。拖动数字也可以让它滑入空白格。</p>

      <div class="preview-frame">
        <img id="previewImg" src="assets/number_level_3.png" alt="3 × 3 关卡完成示意图">
      </div>

      <div class="start-actions">
        <button id="startBtn" class="start-btn" type="button" aria-label="开始游戏">
          <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
            <circle cx="48" cy="48" r="40" fill="currentColor"></circle>
            <path d="M40 30 69 48 40 66Z" fill="#fffdf9"></path>
          </svg>
        </button>
        <span class="start-caption">开始游戏</span>
        <button id="recordsBtn" class="text-btn" type="button">游戏记录</button>
      </div>
    </section>

    <section id="gameView" class="view game-view" aria-label="游戏进行中" hidden>
      <div class="game-top">
        <button id="hintBtn" class="hint-btn" type="button" aria-label="提示下一步">提示</button>
        <span id="timer" class="timer">00:00:00</span>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="暂停游戏">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <circle cx="24" cy="24" r="20" fill="currentColor"></circle>
            <rect x="18" y="14" width="4" height="20" rx="1.6" fill="#fffdf9"></rect>
            <rect x="26" y="14" width="4" height="20" rx="1.6" fill="#fffdf9"></rect>
          </svg>
        </button>
      </div>

      <div id="board" class="board" role="group" aria-label="数字推盘棋盘"></div>
      <p class="game-hint">点击空白格旁边的数字，或把它拖向空白格</p>
    </section>
  </main>

  <div id="levelModal" class="scrim scrim--sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="levelModalTitle">
      <h2 id="levelModalTitle" class="sheet-title">选择游戏难度：</h2>
      <div class="level-list" role="radiogroup" aria-labelledby="levelModalTitle">
        <button class="level-row" type="button" role="radio" aria-checked="true" data-level="3">
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
              <path class="tick" d="M7 12.2 10.6 15.8 17 8.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span class="level-name">低级</span>
          <span class="level-desc">3 X 3</span>
        </button>
        <button class="level-row" type="button" role="radio" aria-checked="false" data-level="4">
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
              <path class="tick" d="M7 12.2 10.6 15.8 17 8.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span class="level-name">中级</span>
          <span class="level-desc">4 X 4</span>
        </button>
        <button class="level-row" type="button" role="radio" aria-checked="false" data-level="5">
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
              <path class="tick" d="M7 12.2 10.6 15.8 17 8.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <span class="level-name">高级</span>
          <span class="level-desc">5 X 5</span>
        </button>
      </div>
    </div>
  </div>

  <div id="pauseModal" class="scrim" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <p id="pauseTitle" class="dialog-title">点击下方按钮继续游戏</p>
      <button id="resumeBtn" class="round-btn" type="button" aria-label="继续游戏">
        <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <circle cx="48" cy="48" r="40" fill="currentColor"></circle>
          <path d="M40 30 69 48 40 66Z" fill="#fffdf9"></path>
        </svg>
      </button>
      <button id="exitBtn" class="danger-btn" type="button">退出游戏</button>
    </div>
  </div>

  <div id="successModal" class="scrim" hidden>
    <div class="dialog dialog--success" role="dialog" aria-modal="true" aria-labelledby="successTitle">
      <h2 id="successTitle" class="success-title">胜利了！</h2>
      <p class="success-sub">所有数字都回到正确的位置</p>
      <div class="dialog-actions">
        <button id="closeSuccessBtn" class="btn btn--ghost" type="button">关闭</button>
        <button id="playAgainBtn" class="btn btn--solid" type="button">再玩一次</button>
      </div>
    </div>
  </div>

  <div id="recordsModal" class="scrim scrim--sheet" hidden>
    <div class="sheet sheet--records" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">
      <div class="sheet-head">
        <h2 id="recordsTitle" class="sheet-title">游戏记录</h2>
        <button id="clearRecordsBtn" class="text-btn text-btn--danger" type="button">清空</button>
      </div>
      <div id="bestGrid" class="best-grid"></div>
      <p id="recordsEmpty" class="records-empty" hidden>还没有通关记录，完成一局试试。</p>
      <ol id="recordsList" class="records-list"></ol>
      <button id="closeRecordsBtn" class="btn btn--ghost sheet-close" type="button">关闭</button>
    </div>
  </div>

  <script defer src="js/game.js"></script>
</body>
</html>
